spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              key-store: ${GATEWAY_CLIENT_KEYSTORE:file:../certificates/gateway-client.p12}
              key-store-password: ${GATEWAY_CLIENT_KEYSTORE_PASSWORD}
              key-store-type: PKCS12

              trusted-x509-certificates:
                - ${BACKEND_CA_CERT:file:../certificates/ca.crt}