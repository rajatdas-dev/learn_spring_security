server.port=8443

# Backend's HTTPS server identity.
server.ssl.enabled=true
server.ssl.key-store=${BACKEND_SERVER_KEYSTORE:file:./certificates/backend-server.p12}
server.ssl.key-store-password=${BACKEND_SERVER_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Require and validate the Gateway's client certificate.
server.ssl.client-auth=need
server.ssl.trust-store=${BACKEND_TRUSTSTORE:file:./certificates/backend-truststore.p12}
server.ssl.trust-store-password=${BACKEND_TRUSTSTORE_PASSWORD}
server.ssl.trust-store-type=PKCS12