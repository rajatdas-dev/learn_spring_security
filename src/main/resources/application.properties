spring.application.name=spring_security_demo

# ============================================================
# Google OIDC
# ============================================================

oauth2.google.issuer-uri=https://accounts.google.com
oauth2.google.client-id=${GOOGLE_CLIENT_ID}

# ============================================================
# Database
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/spring_security_db
spring.datasource.username=postgres
spring.datasource.password=raju5403

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

jwt.private-key=classpath:keys/private_key.pem
jwt.public-key=classpath:keys/public_key.pem