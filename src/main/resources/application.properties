spring.application.name=spring_security_demo

# ============================================================
# Google OIDC
# ============================================================

oauth2.google.issuer-uri=https://accounts.google.com
oauth2.google.client-id=${GOOGLE_CLIENT_ID}

# ============================================================
# Database
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/spring_security_db
spring.datasource.username=postgres
spring.datasource.password=raju5403

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# JWT signing keys
jwt.private-key=${JWT_PRIVATE_KEY:file:./secrets/private_key.pem}
jwt.public-key=${JWT_PUBLIC_KEY:file:./secrets/public_key.pem}

# JWT validation
jwt.issuer=${JWT_ISSUER:spring-security-learning}
jwt.audience=${JWT_AUDIENCE:spring-security-api}

#jwt.private-key=classpath:keys/private_key.pem
#jwt.public-key=classpath:keys/public_key.pem

# Access token: 15 minutes
jwt.access-token-ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}

# Refresh token: 7 days
jwt.refresh-token-ttl-ms=${JWT_REFRESH_TOKEN_TTL_MS:604800000}

# 60 seconds clock tolerance
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:60}